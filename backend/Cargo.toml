[package]
name = "y-junction-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "import"
path = "src/bin/import.rs"

[[bin]]
name = "import-elevation"
path = "src/bin/import_elevation.rs"

[[bin]]
name = "import-baidu-panoid"
path = "src/bin/import_baidu_panoid.rs"

[[bin]]
name = "pipeline-download-osm"
path = "src/bin/pipeline_download_osm.rs"

[[bin]]
name = "pipeline-extract-three-way"
path = "src/bin/pipeline_extract_three_way.rs"

[[bin]]
name = "pipeline-prepare-serving"
path = "src/bin/pipeline_prepare_serving.rs"

[[bin]]
name = "pipeline-load-to-cockroach"
path = "src/bin/pipeline_load_to_cockroach.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["query"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "tls-rustls", "macros", "migrate"], default-features = false }
osmpbf = "0.3"
geo = "0.33"
glob = "0.3"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
dashmap = "6.1"
rayon = "1.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
rand = "0.10"
object_store = { version = "0.13", features = ["gcp"] }
parquet = { version = "58", default-features = false, features = ["snap"] }
parquet_derive = "58"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
url = "2"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
serial_test = "3"
