# mise configuration for Y-Junction project
# Install mise: https://mise.jdx.dev/

[tools]
node = "23.11.0"
# sqlx 0.9.0 が rustc 1.94.0 以上を要求する。CI (backend-ci.yml) とも揃える
rust = "1.94.0"
terraform = "1.14.0"

# =====================================
# Deploy Tasks
# =====================================

[tasks."backend:build"]
description = "Build and push backend Docker image"
run = "gcloud builds submit --tag asia-northeast1-docker.pkg.dev/y-junctions-prod/y-junctions/backend:latest ."
dir = "backend"

[tasks."backend:migrate"]
description = "Run database migrations"
run = """
export DATABASE_URL=$(mise exec -- terraform output -raw neon_connection_uri)
sqlx migrate run
"""
dir = "backend"

[tasks."frontend:deploy"]
description = "Build and deploy frontend"
run = """
npm run build
gsutil -m rsync -r -d dist/ gs://y-junctions-prod-frontend
"""
dir = "frontend"

# =====================================
# Code Quality Tasks
# =====================================

[tasks."sonar:coverage:backend"]
description = "Generate backend lcov coverage (requires local DB)"
run = "cargo llvm-cov --all-features --lcov --output-path lcov.info"
dir = "backend"

[tasks."sonar:coverage:frontend"]
description = "Generate frontend lcov coverage"
run = "npm run test:coverage"
dir = "frontend"

[tasks."sonar"]
description = "Run SonarQube Cloud analysis (requires SONAR_TOKEN)"
depends = ["sonar:coverage:backend", "sonar:coverage:frontend"]
run = "sonar-scanner"
