name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🗺️ Region Expansion'
    labels:
      - 'region'
  - title: '✨ Features'
    labels:
      - 'feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
exclude-labels:
  - 'internal'
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## 変更内容

  $CHANGES
  
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'region'
  patch:
    labels:
      - 'bug'
  default: patch
autolabeler:
  # データ追加の自動ラベリング
  - label: 'region'
    branch:\n      - '/^data\\/.*/'
