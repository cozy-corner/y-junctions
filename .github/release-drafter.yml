name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '📊 Data Updates'
    labels:
      - 'data'
  - title: '✨ Features'
    labels:
      - 'feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
exclude-labels:
  - 'internal'
  - 'dependencies'
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## 変更内容

  $CHANGES
  
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'data'
  patch:
    labels:
      - 'bug'
  default: patch
autolabeler:
  # データ追加・更新の自動ラベリング
  - label: 'data'
    branch:
      - '/^data\/.*/'
    files:
      - 'doc/data-updates.md'
    title:
      - '/地域|データ|インポート|追加|道|県|府/'
  
  # 新機能の自動ラベリング
  - label: 'feature'
    branch:
      - '/^feature\/.*/'
    title:
      - '/feat|feature|新機能|機能追加/'
  
  # バグ修正の自動ラベリング
  - label: 'bug'
    branch:
      - '/^fix\/.*/'
      - '/^bugfix\/.*/'
    title:
      - '/fix|bug|修正|バグ/'
  
  # 内部改善（リリースノートに含めない）
  - label: 'internal'
    branch:
      - '/^refactor\/.*/'
      - '/^chore\/.*/'
      - '/^perf\/.*/'
      - '/^style\/.*/'
      - '/^docs\/.*/'
      - '/^dependabot\/.*/'
    title:
      - '/refactor|chore|perf|style|docs|リファクタ|チューニング|最適化/'
