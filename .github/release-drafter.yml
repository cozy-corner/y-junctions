name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '📊 Data Updates'
    labels:
      - 'data'
  - title: '✨ Features'
    labels:
      - 'feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
exclude-labels:
  - 'internal'
  - 'dependencies'
  - 'skip-changelog'
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## 変更内容

  $CHANGES
  
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'data'
  patch:
    labels:
      - 'bug'
  default: patch
autolabeler:
  # データ追加・更新の自動ラベリング
  #
  # title 条件は置かない。autolabeler は branch / files / title を OR で
  # 評価するため、「追加」「道」のような汎用語を入れると無関係な PR にも
  # data が付く。data は version-resolver の minor に入っているので、
  # 誤ラベルはリリースノート誤載と不要な minor bump に直結する。
  # データ更新は data/* ブランチか doc/data-updates.md の変更で判定する。
  - label: 'data'
    branch:
      - '/^data\/.*/'
    files:
      - 'doc/data-updates.md'
  
  # 新機能の自動ラベリング
  - label: 'feature'
    branch:
      - '/^feature\/.*/'
    title:
      - '/feat|feature|新機能|機能追加/'
  
  # バグ修正の自動ラベリング
  - label: 'bug'
    branch:
      - '/^fix\/.*/'
      - '/^bugfix\/.*/'
    title:
      - '/fix|bug|修正|バグ/'
  
  # 内部改善（リリースノートに含めない）
  - label: 'internal'
    branch:
      - '/^refactor\/.*/'
      - '/^chore\/.*/'
      - '/^perf\/.*/'
      - '/^style\/.*/'
      - '/^docs\/.*/'
      - '/^dependabot\/.*/'
    title:
      - '/refactor|chore|perf|style|docs|リファクタ|チューニング|最適化/'
