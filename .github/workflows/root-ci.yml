name: Root CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/root-ci.yml'

jobs:
  install:
    name: Root - Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile
