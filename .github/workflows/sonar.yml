name: SonarQube Cloud

# PR ごとではなくリポジトリ全体の品質を定期的に評価する。
# main への push はほぼ Dependabot のマージでソースが変わらないため契機にしない。
on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 09:00 JST
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze repository
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: y_junction
          POSTGRES_PASSWORD: y_junction
          POSTGRES_DB: y_junction
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://y_junction:y_junction@localhost:5432/y_junction_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Sonar は git blame でコードの新旧を判定するため全履歴が必要
          fetch-depth: 0

      # Rust 解析はスキャナが cargo と clippy を PATH から呼ぶため、
      # scan action より前にツールチェインを用意しておく必要がある
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          components: clippy, llvm-tools-preview

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-llvm-cov

      - name: Create test database
        run: psql -h localhost -U y_junction -d y_junction -c "CREATE DATABASE y_junction_test;"
        env:
          PGPASSWORD: y_junction

      - name: Run backend tests with coverage
        working-directory: backend
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23.11.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
