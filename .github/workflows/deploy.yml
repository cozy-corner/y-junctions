name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  RUST_VERSION: '1.90.0'
  NODE_VERSION: '23.11.0'

jobs:
  # Detect changes to determine which jobs to run
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend-deploy: ${{ steps.filter.outputs.backend-deploy }}
      frontend: ${{ steps.filter.outputs.frontend }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      pipeline-staging-migrate: ${{ steps.filter.outputs.pipeline-staging-migrate }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # backend: Triggers tests for any backend changes
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            # backend-deploy: Triggers deployment, excluding CLI import tools
            backend-deploy:
              - 'backend/src/**'
              - '!backend/src/bin/import*.rs'  # Import tools are CLI-only, not deployed
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'backend/Dockerfile'
              - 'backend/migrations/**'
              - '.github/workflows/deploy.yml'
            # frontend: Triggers tests and deployment for frontend changes
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            # pipeline: Triggers pipeline image build & push (Cloud Run Jobs)
            # pipeline binaries link against importer/, pipeline/, domain/ and lib.rs
            # (transitive deps: importer -> domain). Add new shared modules here when
            # they are introduced — verify with `cargo tree --bin pipeline-*`.
            pipeline:
              - 'pipeline/**'
              - 'backend/src/bin/pipeline_*.rs'
              - 'backend/src/lib.rs'
              - 'backend/src/importer/**'
              - 'backend/src/pipeline/**'
              - 'backend/src/domain/**'
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - '.github/workflows/deploy.yml'
            # pipeline-staging-migrate: Triggers staging DB migrations only when
            # migration files (or this workflow) change. Kept narrow on purpose so
            # that ordinary backend code edits do not touch the staging DB.
            pipeline-staging-migrate:
              - 'backend/migrations/**'
              - '.github/workflows/deploy.yml'

  # Backend Test Job
  backend-test:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: y_junction
          POSTGRES_PASSWORD: y_junction
          POSTGRES_DB: y_junction
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://y_junction:y_junction@localhost:5432/y_junction_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: Create test database
        run: psql -h localhost -U y_junction -d y_junction -c "CREATE DATABASE y_junction_test;"
        env:
          PGPASSWORD: y_junction

      - name: Run tests
        run: cargo test --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Frontend Test Job
  frontend-test:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  # Backend Deploy Job
  backend-deploy:
    name: Backend - Deploy
    runs-on: ubuntu-latest
    needs: [changes, backend-test]
    if: |
      always() &&
      needs.changes.outputs.backend-deploy == 'true' &&
      needs.backend-test.result == 'success'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Rust for migrations
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache SQLx CLI
        id: cache-sqlx
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli

      - name: Install SQLx CLI
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: sqlx migrate run

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        working-directory: backend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --cache-from type=registry,ref=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/backend:cache \
            --cache-to type=registry,ref=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/backend:cache,mode=max \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/backend:${{ github.sha }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/backend:latest \
            .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy y-junctions-api \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/backend:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account cloud-run-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}",RUST_LOG=info \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe y-junctions-api \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Backend deployed to: $SERVICE_URL"

          # Health check
          for i in {1..5}; do
            if curl -f --max-time 30 "$SERVICE_URL/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, checking for rollback..."
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service=y-junctions-api \
            --region=${{ secrets.GCP_REGION }} \
            --format="value(name)" \
            --sort-by=~createdTime \
            | sed -n '2p')

          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "Rolling back to $PREVIOUS_REVISION"
            gcloud run services update-traffic y-junctions-api \
              --region=${{ secrets.GCP_REGION }} \
              --to-revisions=$PREVIOUS_REVISION=100
          fi

      - name: Cleanup old revisions
        if: success()
        run: |
          gcloud run revisions list \
            --service=y-junctions-api \
            --region=${{ secrets.GCP_REGION }} \
            --format="value(name)" \
            --sort-by=~createdTime \
            | tail -n +6 \
            | xargs -I {} gcloud run revisions delete {} \
              --region=${{ secrets.GCP_REGION }} \
              --quiet \
            || true

  # Frontend Deploy Job
  frontend-deploy:
    name: Frontend - Deploy
    runs-on: ubuntu-latest
    needs: [changes, frontend-test]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend-test.result == 'success'

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Storage
        run: |
          gsutil -m rsync -r -d dist/ gs://${{ secrets.GCP_BUCKET_NAME }}

      - name: Verify deployment
        run: |
          echo "Frontend deployed to: https://storage.googleapis.com/${{ secrets.GCP_BUCKET_NAME }}/index.html"

  # Pipeline Image Build & Push Job (Cloud Run Jobs base image)
  pipeline-deploy:
    name: Pipeline - Build & Push Image
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.pipeline == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --file pipeline/Dockerfile \
            --cache-from type=registry,ref=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/pipeline:cache \
            --cache-to type=registry,ref=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/pipeline:cache,mode=max \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/pipeline:${{ github.sha }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y-junctions/pipeline:latest \
            .

  # Pipeline Staging DB Migration Job
  # Applies sqlx migrations to the y_junctions_pipeline_smoke staging DB.
  # Independent of backend-deploy so ordinary backend code edits do not touch it.
  pipeline-staging-migrate:
    name: Pipeline - Staging DB Migrate
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.pipeline-staging-migrate == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust for migrations
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache SQLx CLI
        id: cache-sqlx
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli

      - name: Install SQLx CLI
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Run database migrations (pipeline staging)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_SMOKE_DATABASE_URL }}
        run: sqlx migrate run

  # Post-Deploy Job
  post-deploy:
    name: Post-Deploy Summary
    runs-on: ubuntu-latest
    needs: [changes, backend-deploy, frontend-deploy, pipeline-deploy, pipeline-staging-migrate]
    if: |
      always() &&
      (needs.backend-deploy.result != 'skipped' ||
       needs.frontend-deploy.result != 'skipped' ||
       needs.pipeline-deploy.result != 'skipped' ||
       needs.pipeline-staging-migrate.result != 'skipped')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Generate deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Backend status
          BACKEND_RESULT="${{ needs.backend-deploy.result }}"
          if [ "$BACKEND_RESULT" == "success" ]; then
            BACKEND_URL=$(gcloud run services describe y-junctions-api \
              --region ${{ secrets.GCP_REGION }} \
              --format 'value(status.url)')
            echo "✅ **Backend**: Deployed successfully to $BACKEND_URL" >> $GITHUB_STEP_SUMMARY
          elif [ "$BACKEND_RESULT" == "skipped" ]; then
            echo "⏭️ **Backend**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Backend**: Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Frontend status
          FRONTEND_RESULT="${{ needs.frontend-deploy.result }}"
          if [ "$FRONTEND_RESULT" == "success" ]; then
            echo "✅ **Frontend**: Deployed successfully to Cloud Storage" >> $GITHUB_STEP_SUMMARY
          elif [ "$FRONTEND_RESULT" == "skipped" ]; then
            echo "⏭️ **Frontend**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Frontend**: Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Pipeline image status
          PIPELINE_RESULT="${{ needs.pipeline-deploy.result }}"
          if [ "$PIPELINE_RESULT" == "success" ]; then
            echo "✅ **Pipeline image**: Built & pushed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "$PIPELINE_RESULT" == "skipped" ]; then
            echo "⏭️ **Pipeline image**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pipeline image**: Build/push failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Pipeline staging migration status
          PIPELINE_STAGING_MIGRATE_RESULT="${{ needs.pipeline-staging-migrate.result }}"
          if [ "$PIPELINE_STAGING_MIGRATE_RESULT" == "success" ]; then
            echo "✅ **Pipeline staging migrate**: Applied successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "$PIPELINE_STAGING_MIGRATE_RESULT" == "skipped" ]; then
            echo "⏭️ **Pipeline staging migrate**: Skipped (no migration changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pipeline staging migrate**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        run: |
          BACKEND_STATUS="${{ needs.backend-deploy.result }}"
          FRONTEND_STATUS="${{ needs.frontend-deploy.result }}"
          PIPELINE_STATUS="${{ needs.pipeline-deploy.result }}"
          PIPELINE_STAGING_MIGRATE_STATUS="${{ needs.pipeline-staging-migrate.result }}"

          # スキップされたものは無視し、実行されたものが全て成功かチェック
          FAILED=false

          if [ "$BACKEND_STATUS" != "skipped" ] && [ "$BACKEND_STATUS" != "success" ]; then
            echo "❌ Backend deployment failed or was cancelled"
            FAILED=true
          fi

          if [ "$FRONTEND_STATUS" != "skipped" ] && [ "$FRONTEND_STATUS" != "success" ]; then
            echo "❌ Frontend deployment failed or was cancelled"
            FAILED=true
          fi

          if [ "$PIPELINE_STATUS" != "skipped" ] && [ "$PIPELINE_STATUS" != "success" ]; then
            echo "❌ Pipeline image build/push failed or was cancelled"
            FAILED=true
          fi

          if [ "$PIPELINE_STAGING_MIGRATE_STATUS" != "skipped" ] && [ "$PIPELINE_STAGING_MIGRATE_STATUS" != "success" ]; then
            echo "❌ Pipeline staging DB migration failed or was cancelled"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            exit 1
          else
            echo "✅ All executed deployments successful"
            exit 0
          fi
