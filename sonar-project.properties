sonar.projectKey=cozy-corner_y-junctions
sonar.organization=cozy-corner

# アプリコードだけでなく CI 設定 (.github/workflows) と IaC (terraform) も対象にする。
# 壊れると影響が大きい割にレビューが薄くなりやすく、Sonar のルールが効く領域のため
sonar.sources=.
sonar.tests=backend/tests

sonar.exclusions=\
  backend/tests/**,\
  backend/migrations/**,\
  backend/target/**,\
  backend/lcov.info,\
  frontend/node_modules/**,\
  frontend/dist/**,\
  frontend/coverage/**,\
  frontend/src/test/**,\
  data/**

# backend/tests: 同一ファイルを source と test の両方に割り当てると二重インデックスでエラーになる
# backend/migrations: Sonar が .sql を Oracle PL/SQL と誤認し、VARCHAR2 を使え等の
#   CockroachDB では成立しない指摘を出すため（20 件全てがこの種のノイズだった）

sonar.rust.cargo.manifestPaths=backend/Cargo.toml
sonar.rust.lcov.reportPaths=backend/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
