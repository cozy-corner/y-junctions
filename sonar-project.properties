sonar.projectKey=cozy-corner_y-junctions
sonar.organization=cozy-corner

# リポジトリ全体を対象にする。Automatic Analysis が既に .github/workflows /
# terraform / backend/migrations の指摘を出しているため、範囲を狭めるとそれらが
# 「解析されていない = 問題なし」扱いになって消える
sonar.sources=.
sonar.tests=backend/tests

# 同一ファイルを source と test の両方に割り当てると二重インデックスでエラーになる
sonar.exclusions=\
  backend/tests/**,\
  backend/target/**,\
  backend/lcov.info,\
  frontend/node_modules/**,\
  frontend/dist/**,\
  frontend/coverage/**,\
  frontend/src/test/**,\
  data/**

sonar.rust.cargo.manifestPaths=backend/Cargo.toml
sonar.rust.lcov.reportPaths=backend/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
